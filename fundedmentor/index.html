<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="description" content="FundedMentor turns your prop firm rules into a live daily plan: daily loss, drawdown, position size, next trade and payouts."><link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 64 64%22%3E%3Ccircle cx=%2232%22 cy=%2232%22 r=%2230%22 fill=%22%23DCBE7D%22/%3E%3Ccircle cx=%2232%22 cy=%2232%22 r=%2224%22 fill=%22%230B0A09%22/%3E%3Ctext x=%2232%22 y=%2240%22 font-family=%22Arial%22 font-size=%2220%22 fill=%22%23DCBE7D%22 text-anchor=%22middle%22%3EFM%3C/text%3E%3C/svg%3E"><style>:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style></head><body><title>FundedMentor</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" content="#0B0A09">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600&family=Geist+Mono:wght@400;500&display=swap">
<style>
/* Layout: sidebar + content on desktop; sticky top bar + bottom tab bar on phones.
   Direction: a private-desk risk terminal. Warm graphite neutrals, one champagne-gold accent (XAU),
   numbers set in mono, a single glowing hero with buffer gauges. Dark-first. */
:root {
  /* Aurum II: one committed dark look. Warm black, champagne gold used sparingly, soft green/red for P&L only. */
  --bg: #0B0A09; --surface: #141311; --surface-2: #1A1916; --surface-3: #22201C;
  --line: rgba(255,255,255,.06); --line-2: rgba(255,255,255,.1); --hi: rgba(255,248,230,.07);
  --fg: #EFEBE2; --muted: #8C877B; --faint: #6A665D;
  --accent: #DCBE7D; --accent-2: #F3E3B8; --accent-ink: #241A08; --accent-soft: rgba(220,190,125,.12);
  --gold: linear-gradient(180deg, #FBF3DE 0%, #E2C890 55%, #B39255 100%);
  --pos: #8FCBA8; --pos-soft: rgba(143,203,168,.12); --warn: #E0AE62; --warn-soft: rgba(224,174,98,.12); --neg: #E8978E; --neg-soft: rgba(232,151,142,.11);
  --glow: rgba(220,190,125,.10); --shadow: inset 0 1px 0 var(--hi), 0 0 0 1px var(--line);
  --f-display: "Geist", "Helvetica Neue", Arial, sans-serif;
  --f-body: "Geist", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-num: "Geist", system-ui, sans-serif;
  --r: 20px; --r-sm: 12px;
  color-scheme: dark;
}

html, body { height: 100%; }
html { -webkit-text-size-adjust: 100%; }
body { background: radial-gradient(110% 50% at 50% -8%, #221B11 0%, rgba(34,27,17,0) 60%) fixed, var(--bg); color: var(--fg); font: 400 14px/1.5 var(--f-body); font-variant-numeric: tabular-nums; -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 25; background: var(--bg); }
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
h1, h2, h3 { font-family: var(--f-display); font-weight: 500; margin: 0; text-wrap: balance; letter-spacing: -0.02em; }
h1 { font-size: 26px; line-height: 1.15; } h2 { font-size: 16px; } h3 { font-size: 14px; }
p { margin: 0; }
a { color: var(--accent); }
.num { font-family: var(--f-num); font-variant-numeric: tabular-nums; letter-spacing: -0.01em; }
.muted { color: var(--muted); } .faint { color: var(--faint); }
.pos { color: var(--pos); } .neg { color: var(--neg); } .warnc { color: var(--warn); }
.label { font-size: 11px; text-transform: uppercase; letter-spacing: .09em; color: var(--muted); font-weight: 500; }
button, input, select, textarea { font: inherit; color: inherit; }
button, [data-act], .pick button, .tabbar button { touch-action: manipulation; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* Brand */
.mark { width: 30px; height: 30px; border-radius: 9px; flex: none; display: grid; place-items: center; font: 700 12px/1 var(--f-display); letter-spacing: -.02em; color: var(--accent-ink);
  background: linear-gradient(145deg, var(--accent-2), var(--accent) 55%, color-mix(in srgb, var(--accent) 70%, #000)); box-shadow: 0 1px 0 rgba(255,255,255,.35) inset, 0 4px 14px -6px var(--accent); }
.top-mark { display: none; }

/* Shell */
.app { display: grid; grid-template-columns: 240px minmax(0, 1fr); min-height: 100%; }
.side { border-right: 1px solid var(--line); padding: 20px 12px; position: sticky; top: env(safe-area-inset-top, 0px); height: 100vh; overflow-y: auto; display: flex; flex-direction: column; gap: 22px; background: var(--bg); }
.brand { display: flex; align-items: center; gap: 11px; padding: 0 8px; }
.brand b { font-family: var(--f-display); font-size: 16px; letter-spacing: -.02em; display: block; }
.brand small { display: block; color: var(--faint); font-size: 11px; }
.nav { display: flex; flex-direction: column; gap: 2px; }
.nav button { display: flex; align-items: center; gap: 11px; text-align: left; padding: 8px 10px; border: 0; background: none; border-radius: var(--r-sm); color: var(--muted); cursor: pointer; font-weight: 500; position: relative; transition: background .15s, color .15s; }
.nav button:hover { background: var(--surface-2); color: var(--fg); }
.nav button[aria-current="page"] { background: var(--surface-2); color: var(--fg); }
.nav button[aria-current="page"]::before { content: ""; position: absolute; left: -12px; top: 9px; bottom: 9px; width: 3px; border-radius: 0 3px 3px 0; background: var(--accent); }
.nav button[aria-current="page"] svg { color: var(--accent); }
.nav svg { width: 17px; height: 17px; flex: none; }
.nav .sep { height: 1px; background: var(--line); margin: 10px 10px; }
.main { min-width: 0; padding-left: max(32px, env(safe-area-inset-left, 0px)); padding-right: max(32px, env(safe-area-inset-right, 0px)); padding-block: 0 80px; max-width: 1320px; width: 100%; }
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--bg); display: flex; align-items: center; gap: 12px; padding-block: 14px; border-bottom: 1px solid var(--line); margin-bottom: 26px; }
.top .grow { flex: 1; min-width: 0; }
.tabbar { display: none; }

/* Controls */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 7px; height: 36px; padding: 0 15px; border-radius: var(--r-sm); border: 1px solid var(--line-2); background: var(--surface); cursor: pointer; font-weight: 500; white-space: nowrap; transition: background .15s, border-color .15s, transform .08s; }
.btn:hover { background: var(--surface-2); }
.btn:active, .pick button:active, .nav button:active, .acct-pill:active, .fab:active { transform: scale(.97); }
.btn.primary { background: linear-gradient(180deg, #F3E3B8 0%, #DCBE7D 55%, #B8954F 100%); color: var(--accent-ink); border-color: transparent; font-weight: 500; box-shadow: inset 0 1px 0 rgba(255,252,238,.85), inset 0 -1px 0 rgba(110,80,30,.5), 0 10px 22px -14px rgba(220,190,125,.6); }
.btn.primary:hover { filter: brightness(1.05); }
.btn.ghost { background: none; border-color: transparent; color: var(--muted); }
.btn.ghost:hover { color: var(--fg); background: var(--surface-2); }
.btn.danger { color: var(--neg); }
.btn.sm { height: 30px; padding: 0 11px; font-size: 13px; }
.btn:disabled { opacity: .4; cursor: not-allowed; transform: none; }
.field { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.field > span { font-size: 12px; color: var(--muted); font-weight: 500; }
.input, select.input { height: 40px; padding: 0 12px; border-radius: var(--r-sm); border: 1px solid var(--line-2); background: var(--surface-2); width: 100%; min-width: 0; transition: border-color .15s, box-shadow .15s; }
textarea.input { height: auto; padding: 10px 12px; resize: vertical; font-family: var(--f-num); font-size: 12px; }
.input:focus { border-color: var(--accent); outline: none; box-shadow: 0 0 0 3px var(--accent-soft); }
.input.num { text-align: right; }
.hint { font-size: 12px; color: var(--faint); }
.seg { display: inline-flex; padding: 3px; border-radius: 10px; background: var(--surface-2); border: 1px solid var(--line); flex-wrap: wrap; gap: 2px; }
.seg button { border: 0; background: none; padding: 6px 13px; border-radius: 7px; cursor: pointer; color: var(--muted); font-weight: 500; font-size: 13px; transition: background .15s, color .15s; }
.seg button[aria-pressed="true"] { background: var(--surface-3); color: var(--fg); box-shadow: 0 1px 0 var(--hi) inset, 0 1px 3px rgba(0,0,0,.25); }

/* Surfaces */
.panel { background: linear-gradient(180deg, rgba(255,255,255,.04), rgba(255,255,255,.012)); border: 0; border-radius: var(--r); padding: 22px; min-width: 0; box-shadow: var(--shadow); }
.panel-h { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin-bottom: 16px; flex-wrap: wrap; }
.grid { display: grid; gap: 16px; }
.g2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.g3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.g4 { grid-template-columns: repeat(4, minmax(0, 1fr)); }
.span2 { grid-column: span 2; }
.stack { display: flex; flex-direction: column; gap: 16px; min-width: 0; }
.row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.between { justify-content: space-between; }
.page-h { display: flex; justify-content: space-between; align-items: flex-end; gap: 16px; margin-bottom: 20px; flex-wrap: wrap; }
.page-h p { color: var(--muted); margin-top: 6px; max-width: 62ch; }

/* Hero: equity on the left, the gold bezel dial with Next trade under it. */
.hero { position: relative; display: grid; grid-template-columns: minmax(0, 1.2fr) minmax(0, 1fr); align-items: center; gap: 28px; padding: 30px 34px; margin-bottom: 16px; border-radius: 26px; overflow: hidden;
  background: linear-gradient(180deg, rgba(255,255,255,.045), rgba(255,255,255,.012)); box-shadow: inset 0 1px 0 var(--hi), 0 0 0 1px rgba(220,190,125,.12); }
.hero-main { display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.hero-num { font: 300 clamp(40px, 6vw, 58px)/1 var(--f-num); letter-spacing: -.05em; background: var(--gold); -webkit-background-clip: text; background-clip: text; color: transparent; }
.hero-num .cents { opacity: .5; }
.hero-sub { font-size: 14px; color: var(--muted); }
.hero-stats { display: flex; flex-wrap: wrap; gap: 14px 30px; margin-top: 14px; }
.hero-stats div { display: flex; flex-direction: column; gap: 3px; }
.hero-stats span { font-size: 12px; color: var(--muted); }
.hero-stats b { font-size: 17px; font-weight: 400; }
.hero-stats small { color: var(--faint); font-size: 13px; }
.hero-dial { display: flex; flex-direction: column; align-items: center; gap: 18px; }

/* Gold bezel */
.bezel { position: relative; width: var(--bz); max-width: 100%; aspect-ratio: 1; transform: perspective(1000px) rotateX(12deg); flex: none; }
.bezel > i { position: absolute; border-radius: 50%; }
.bz-rim { inset: 0; background: conic-gradient(from 215deg, #4E3A16, #EFDDAE 9%, #A07E3F 20%, #FBF0D0 31%, #6F5424 46%, #DCBE7D 61%, #8E6E35 76%, #F6E8C2 89%, #4E3A16); box-shadow: 0 28px 44px -20px rgba(0,0,0,.95), 0 0 0 1px rgba(255,240,205,.12), inset 0 1px 1px rgba(255,250,232,.7), inset 0 -2px 3px rgba(30,20,4,.7); }
.bz-flute { inset: 0; background: repeating-conic-gradient(rgba(40,28,8,.28) 0deg .6deg, transparent .6deg 2.4deg); -webkit-mask: radial-gradient(circle, transparent 92%, #000 93%); mask: radial-gradient(circle, transparent 92%, #000 93%); }
.bz-face { inset: 4.4%; background: radial-gradient(circle at 36% 28%, #252321 0%, #111110 48%, #070707 100%); box-shadow: inset 0 0 0 1px rgba(255,236,190,.18), inset 0 8px 22px rgba(0,0,0,.95); }
.bz-min { inset: 7.9%; background: repeating-conic-gradient(rgba(226,200,144,.42) 0deg .5deg, transparent .5deg 6deg); -webkit-mask: radial-gradient(circle, transparent 90%, #000 91%); mask: radial-gradient(circle, transparent 90%, #000 91%); }
.bz-hr { inset: 7.9%; background: repeating-conic-gradient(rgba(240,220,174,.9) 0deg 1deg, transparent 1deg 30deg); -webkit-mask: radial-gradient(circle, transparent 86%, #000 87%); mask: radial-gradient(circle, transparent 86%, #000 87%); }
.bz-gloss { inset: 4.4%; background: linear-gradient(155deg, rgba(255,255,255,.08) 0%, transparent 42%); pointer-events: none; }
.bezel svg { position: absolute; inset: 0; width: 100%; height: 100%; }
.bz-arc { transition: stroke-dashoffset .8s cubic-bezier(.2,.8,.2,1); }
.bz-mid { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; text-align: center; }
.bz-mid b { font: 300 calc(var(--bz) * .19)/1 var(--f-num); letter-spacing: -.05em; color: #F6F1E4; }
.bz-mid b small { font-size: .45em; color: #A99C7C; }
.bz-mid span { font-size: 10px; letter-spacing: .22em; text-transform: uppercase; color: var(--muted); }
.bz-mid em { font-style: normal; font-size: 12px; color: var(--accent); margin-top: 3px; }

/* Next trade (under the dial) */
.next-btn { display: flex; align-items: center; gap: 10px; width: min(320px, 100%); height: 52px; padding: 0 16px 0 18px; border: 0; border-radius: 26px; cursor: pointer; text-align: left; color: var(--accent-ink);
  background: linear-gradient(180deg, #F3E3B8 0%, #DCBE7D 55%, #B8954F 100%); box-shadow: inset 0 1px 0 rgba(255,252,238,.85), inset 0 -1px 0 rgba(110,80,30,.5), 0 12px 24px -14px rgba(220,190,125,.6); transition: transform .08s, filter .15s; }
.next-btn:hover { filter: brightness(1.04); } .next-btn:active { transform: scale(.98); }
.next-btn.static { cursor: default; }
.next-l { font-weight: 600; font-size: 14px; white-space: nowrap; }
.next-v { flex: 1; min-width: 0; font-size: 13px; color: #5E4718; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

/* Limits */
.limits { display: flex; flex-direction: column; gap: 20px; }
.lim { display: flex; flex-direction: column; gap: 9px; }
.lim > .row span { color: var(--muted); }
.lim b { font-size: 20px; font-weight: 400; letter-spacing: -.02em; }
.thread { height: 3px; border-radius: 2px; background: rgba(255,255,255,.07); overflow: hidden; }
.thread i { display: block; height: 100%; border-radius: inherit; background: var(--pos); transition: width .6s cubic-bezier(.2,.8,.2,1); }
.thread i.warn { background: var(--warn); } .thread i.neg { background: var(--neg); }

/* News */
.news { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; }
.news li { display: grid; grid-template-columns: 68px 40px minmax(0, 1fr) auto; gap: 10px; align-items: center; padding: 11px 0; border-top: 1px solid var(--line); font-size: 13px; }
.news li:first-child { border-top: 0; padding-top: 2px; }
.news li.past { opacity: .5; }
.news li.live .news-t { color: var(--accent); }
.news-t { color: var(--muted); }
.news-c { font-size: 11px; font-weight: 500; color: var(--muted); padding: 2px 6px; border-radius: 6px; box-shadow: inset 0 0 0 1px var(--line-2); text-align: center; }
.news-n { display: flex; flex-direction: column; gap: 1px; min-width: 0; }
.news-n b { font-weight: 500; }
.news-n small { color: var(--faint); font-size: 11.5px; }
.imp { font-size: 11px; padding: 2px 8px; border-radius: 10px; }
.imp.hi { color: var(--warn); background: var(--warn-soft); } .imp.md { color: var(--muted); background: var(--surface-3); }
.news-empty { font-size: 13px; padding: 4px 0; }

/* Next trade sheet */
.nt .sheet-h small { display: block; margin-top: 2px; }
.nt-seg { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); }
.nt-seg button { position: relative; padding: 9px 6px; }
.rec { position: absolute; top: 6px; right: 7px; width: 6px; height: 6px; border-radius: 3px; background: var(--accent); }
.nt-hero { display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 10px 0 4px; text-align: center; }
.nt-lots { font: 300 64px/1 var(--f-num); letter-spacing: -.05em; background: var(--gold); -webkit-background-clip: text; background-clip: text; color: transparent; }
.nt-lots small { font-size: 22px; margin-left: 4px; }
.nt-kv { padding: 14px 0; border-block: 1px solid var(--line); }
.nt-why { color: var(--muted); font-size: 13px; line-height: 1.55; }
.nt-stop { padding: 22px; border-radius: var(--r-sm); background: var(--surface-2); box-shadow: var(--shadow); text-align: center; display: flex; flex-direction: column; gap: 6px; }
.nt-stop b { font-size: 18px; font-weight: 500; }
.nt-stop p { color: var(--muted); }


/* P&L calendar */
.cal { margin-bottom: 16px; }
.cal-h { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 14px; }
.cal-h h2 { min-width: 9.5em; text-align: center; }
.cal-sum { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.cal-sum > .num { font-size: 16px; font-weight: 500; }
.cal-g { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 6px; }
.cal-w { font-size: 11px; color: var(--faint); text-transform: uppercase; letter-spacing: .08em; text-align: center; padding-bottom: 2px; }
.cal-c { position: relative; min-height: 64px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface-2); padding: 6px 7px; display: flex; flex-direction: column; gap: 1px; min-width: 0; overflow: hidden; }
.cal-c.empty { border: 0; background: none; }
.cal-c.wkend:not(.win):not(.loss) { opacity: .55; }
.cal-d { font-size: 11px; color: var(--muted); }
.cal-c b { font-size: 12.5px; font-weight: 500; margin-top: auto; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.cal-c small { font-size: 10px; color: var(--muted); }
.cal-c.win { background: color-mix(in srgb, var(--pos) calc(var(--a) * 26%), var(--surface-2)); border-color: color-mix(in srgb, var(--pos) calc(var(--a) * 45%), var(--line)); }
.cal-c.loss { background: color-mix(in srgb, var(--neg) calc(var(--a) * 26%), var(--surface-2)); border-color: color-mix(in srgb, var(--neg) calc(var(--a) * 45%), var(--line)); }
.cal-c.win b { color: var(--pos); } .cal-c.loss b { color: var(--neg); }
.cal-c.today { box-shadow: 0 0 0 2px var(--accent); }

.cal-c { font: inherit; color: inherit; text-align: left; cursor: pointer; }
.cal-c.sel { box-shadow: 0 0 0 1px var(--fg); }
.cal-c.today { box-shadow: 0 0 0 1.5px var(--accent); }
.cal-d { display: flex; align-items: center; gap: 4px; }
.nd { display: inline-block; width: 5px; height: 5px; border-radius: 3px; background: var(--muted); }
.nd.hi { background: var(--warn); }
.cal-legend { display: flex; gap: 16px; margin-top: 12px; font-size: 11.5px; color: var(--faint); }
.cal-legend span { display: flex; align-items: center; gap: 6px; }
.cal-day { margin-top: 16px; padding-top: 16px; border-top: 1px solid var(--line); display: flex; flex-direction: column; gap: 10px; }
.cal-day h3 { font-weight: 500; }

/* KPI */
.kpis { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); border: 1px solid var(--line); border-radius: var(--r); background: var(--surface); box-shadow: var(--shadow); overflow: hidden; }
.kpi { padding: 18px 20px; border-left: 1px solid var(--line); display: flex; flex-direction: column; gap: 7px; min-width: 0; }
.kpi:first-child { border-left: 0; }
.kpi .v { font: 500 23px var(--f-num); font-variant-numeric: tabular-nums; letter-spacing: -.04em; }
.kpi .s { font-size: 12px; color: var(--muted); }
.bar { height: 6px; border-radius: 3px; background: var(--surface-3); overflow: hidden; }
.bar.lg { height: 8px; border-radius: 4px; }
.bar i { display: block; height: 100%; border-radius: inherit; background: var(--fg); transition: width .5s cubic-bezier(.2,.8,.2,1); }
.bar.pos i { background: var(--pos); } .bar.warn i { background: var(--warn); } .bar.neg i { background: var(--neg); }
.bar.acc i { background: linear-gradient(90deg, var(--accent), var(--accent-2)); }

/* Chips & status */
.chip { display: inline-flex; align-items: center; gap: 6px; height: 24px; padding: 0 9px; border-radius: 12px; font-size: 12px; font-weight: 500; background: var(--surface-2); color: var(--muted); white-space: nowrap; border: 1px solid var(--line); }
.chip::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
.chip.nodot::before { display: none; }
.chip.ok { background: var(--pos-soft); color: var(--pos); border-color: transparent; }
.chip.warn { background: var(--warn-soft); color: var(--warn); border-color: transparent; }
.chip.bad { background: var(--neg-soft); color: var(--neg); border-color: transparent; }
.chip.info { background: var(--accent-soft); color: var(--accent); border-color: transparent; }
.rules-list { display: flex; flex-direction: column; }
.rl { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 12px; padding: 12px 0; border-top: 1px solid var(--line); align-items: center; }
.rl:first-child { border-top: 0; padding-top: 0; }
.rl .d { grid-column: 1 / -1; font-size: 12px; color: var(--muted); }
.alert { display: flex; gap: 10px; padding: 11px 14px; border-radius: var(--r-sm); border: 1px solid var(--line); background: var(--surface-2); font-size: 13px; align-items: flex-start; }
.alert svg { width: 16px; height: 16px; flex: none; margin-top: 2px; }
.alert.warn { border-color: color-mix(in srgb, var(--warn) 30%, transparent); background: var(--warn-soft); }
.alert.bad { border-color: color-mix(in srgb, var(--neg) 30%, transparent); background: var(--neg-soft); }
.alert.info { border-color: color-mix(in srgb, var(--accent) 26%, transparent); background: var(--accent-soft); }
.alert.ok { border-color: color-mix(in srgb, var(--pos) 28%, transparent); background: var(--pos-soft); }
.alert.warn svg { color: var(--warn); } .alert.bad svg { color: var(--neg); } .alert.info svg { color: var(--accent); } .alert.ok svg { color: var(--pos); }

/* Tables */
.tw { overflow-x: auto; margin-inline: -20px; padding-inline: 20px; -webkit-overflow-scrolling: touch; }
table { width: 100%; border-collapse: collapse; font-size: 13px; }
th { text-align: left; font-weight: 500; color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: .08em; padding: 0 10px 9px; border-bottom: 1px solid var(--line); white-space: nowrap; }
td { padding: 10px; border-bottom: 1px solid var(--line); white-space: nowrap; font-variant-numeric: tabular-nums; }
tbody tr { transition: background .12s; }
tbody tr:hover { background: var(--surface-2); }
tr:last-child td { border-bottom: 0; }
th:first-child, td:first-child { padding-left: 0; } th:last-child, td:last-child { padding-right: 0; }
td.r, th.r { text-align: right; }

/* Results */
.big { font: 500 42px var(--f-num); letter-spacing: -.05em; font-variant-numeric: tabular-nums; line-height: 1.05; }
.kv { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 10px 16px; font-size: 13px; }
.kv dt { color: var(--muted); } .kv dd { margin: 0; text-align: right; font-family: var(--f-num); font-variant-numeric: tabular-nums; }
.verdict { border-radius: var(--r); padding: 20px; border: 1px solid var(--line); display: flex; flex-direction: column; gap: 6px; }
.verdict.within { background: var(--pos-soft); border-color: color-mix(in srgb, var(--pos) 32%, transparent); }
.verdict.warning { background: var(--warn-soft); border-color: color-mix(in srgb, var(--warn) 32%, transparent); }
.verdict.exceeds { background: var(--neg-soft); border-color: color-mix(in srgb, var(--neg) 32%, transparent); }
.verdict h2 { font-size: 21px; }
.quote { border-left: 2px solid var(--accent); padding: 4px 0 4px 14px; font-family: var(--f-display); font-size: 15px; font-weight: 600; letter-spacing: -.01em; }

/* Account switcher + misc */
.acct-pill { display: flex; align-items: center; gap: 10px; padding: 5px 12px 5px 5px; border: 1px solid var(--line-2); border-radius: 12px; background: var(--surface); cursor: pointer; min-width: 0; max-width: 100%; transition: border-color .15s, transform .08s; }
.acct-pill:hover { border-color: var(--muted); }
.acct-pill .ic { width: 30px; height: 30px; border-radius: 8px; background: var(--accent-soft); color: var(--accent); display: grid; place-items: center; font: 700 11px var(--f-display); flex: none; }
.acct-pill .t { min-width: 0; text-align: left; line-height: 1.25; }
.acct-pill .t b { display: block; font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.acct-pill .t small { color: var(--muted); font-size: 11px; }
.menu { position: absolute; z-index: 40; background: var(--surface); border: 1px solid var(--line-2); border-radius: var(--r); padding: 6px; box-shadow: 0 16px 40px -12px rgba(0,0,0,.6); min-width: 270px; max-width: calc(100vw - 32px); animation: pop .16s cubic-bezier(.2,.8,.2,1) both; transform-origin: top left; }
.menu button { display: flex; width: 100%; gap: 10px; align-items: center; text-align: left; padding: 9px 8px; border: 0; background: none; border-radius: var(--r-sm); cursor: pointer; }
.menu button:hover { background: var(--surface-2); }
.banner { display: flex; gap: 12px; align-items: center; justify-content: space-between; flex-wrap: wrap; padding: 11px 14px; border-radius: var(--r); border: 1px solid var(--line); background: var(--surface); margin-bottom: 20px; font-size: 13px; color: var(--muted); }
.empty { text-align: center; padding: 40px 16px; color: var(--muted); display: flex; flex-direction: column; gap: 12px; align-items: center; }
.list-card { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 14px; padding: 18px 20px; border-top: 1px solid var(--line); align-items: center; }
.list-card:first-child { border-top: 0; }
.chart svg { display: block; width: 100%; height: auto; }
.chart text { fill: var(--faint); font: 10px var(--f-num); }
.toast { position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--fg); color: var(--bg); padding: 10px 18px; border-radius: 12px; font-weight: 500; z-index: 100; box-shadow: 0 12px 30px -10px rgba(0,0,0,.5); animation: toast-in .22s cubic-bezier(.2,.8,.2,1) both; }

/* Overlays */
.overlay { position: fixed; inset: 0; background: rgba(4,4,6,.62); z-index: 60; display: grid; place-items: center; padding: 16px; padding-top: calc(16px + env(safe-area-inset-top, 0px)); padding-bottom: calc(16px + env(safe-area-inset-bottom, 0px)); animation: fade .18s ease both; overscroll-behavior: contain; }
.sheet { background: var(--bg); border: 1px solid var(--line-2); border-radius: 18px; width: min(720px, 100%); max-height: 100%; display: flex; flex-direction: column; overflow: hidden; animation: pop .22s cubic-bezier(.2,.8,.2,1) both; box-shadow: 0 30px 80px -30px rgba(0,0,0,.7); }
.sheet-h { padding: 16px 20px; border-bottom: 1px solid var(--line); display: flex; justify-content: space-between; align-items: center; gap: 12px; }
.sheet-b { padding: 20px; overflow-y: auto; flex: 1; display: flex; flex-direction: column; gap: 16px; overscroll-behavior: contain; -webkit-overflow-scrolling: touch; }
.sheet-f { padding: 14px 20px; border-top: 1px solid var(--line); display: flex; justify-content: space-between; gap: 10px; }
.steps { display: flex; gap: 4px; }
.steps i { width: 22px; height: 3px; border-radius: 2px; background: var(--line-2); transition: background .2s; }
.steps i.on { background: var(--accent); }
.pick { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(200px, 100%), 1fr)); gap: 8px; }
.pick button { text-align: left; padding: 13px 14px; border: 1px solid var(--line-2); border-radius: 12px; background: var(--surface); cursor: pointer; display: flex; flex-direction: column; gap: 4px; transition: border-color .15s, box-shadow .15s, transform .08s; }
.pick button:hover { border-color: var(--muted); }
.pick button[aria-pressed="true"] { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.pick button[aria-pressed="true"] svg { color: var(--accent); }
.pick button:disabled { opacity: .5; cursor: not-allowed; }
.drawer { position: fixed; right: 0; top: 0; bottom: 0; width: min(420px, 100%); background: var(--bg); border-left: 1px solid var(--line-2); z-index: 70; display: flex; flex-direction: column; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); padding-right: env(safe-area-inset-right, 0px); box-shadow: -20px 0 50px -20px rgba(0,0,0,.6); animation: slide-l .26s cubic-bezier(.2,.8,.2,1) both; }
.msgs { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 12px; overscroll-behavior: contain; }
.msg { max-width: 92%; padding: 10px 13px; border-radius: 14px; font-size: 13px; line-height: 1.55; animation: fade .2s ease both; }
.msg.u { align-self: flex-end; background: var(--accent); color: var(--accent-ink); border-bottom-right-radius: 5px; }
.msg.a { align-self: flex-start; background: var(--surface); border: 1px solid var(--line); border-bottom-left-radius: 5px; }
.msg.a b { font-family: var(--f-num); font-weight: 600; }
.sugg { display: flex; flex-wrap: wrap; gap: 6px; padding: 0 16px 10px; }
.sugg button { border: 1px solid var(--line-2); background: var(--surface); border-radius: 16px; padding: 6px 11px; font-size: 12px; cursor: pointer; color: var(--muted); }
.fab { position: fixed; right: max(20px, env(safe-area-inset-right, 0px)); bottom: calc(20px + env(safe-area-inset-bottom, 0px)); z-index: 50; height: 46px; padding: 0 18px; border-radius: 23px; border: 1px solid color-mix(in srgb, var(--accent) 35%, var(--line-2)); background: var(--surface); box-shadow: 0 10px 28px -12px rgba(0,0,0,.7); display: flex; align-items: center; gap: 8px; cursor: pointer; font-weight: 600; transition: transform .08s; }
.fab svg { width: 16px; height: 16px; color: var(--accent); }
.disclaimer { font-size: 12px; color: var(--faint); max-width: 80ch; margin-top: 32px; }

/* First paint while scripts load */
.boot { min-height: 70vh; display: grid; place-items: center; }
.boot div { display: flex; flex-direction: column; align-items: center; gap: 14px; color: var(--muted); font-size: 13px; }
.boot .mark { width: 44px; height: 44px; border-radius: 13px; font-size: 16px; animation: breathe 1.4s ease-in-out infinite; }

/* Sidebar footer */
.side-foot { margin-top: auto; display: flex; align-items: center; gap: 10px; padding: 10px 8px 0; border-top: 1px solid var(--line); }
.side-foot .grow { flex: 1; min-width: 0; line-height: 1.25; }
.side-foot b { display: block; font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.side-foot small { display: block; color: var(--faint); font-size: 11px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.acct-pill-ic { width: 30px; height: 30px; border-radius: 8px; background: var(--accent-soft); color: var(--accent); display: grid; place-items: center; font: 700 11px var(--f-display); flex: none; }
.btn.lg { height: 50px; padding: 0 24px; font-size: 15px; border-radius: 25px; }
.link { border: 0; background: none; padding: 0; color: var(--accent); font-size: 12px; font-weight: 500; cursor: pointer; }

/* ---------- Landing ---------- */
.lp { min-height: 100%; overflow-x: clip; }
.lp-wrap { max-width: 1160px; margin: 0 auto; padding-left: max(24px, env(safe-area-inset-left, 0px)); padding-right: max(24px, env(safe-area-inset-right, 0px)); }
.lp-nav { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: color-mix(in srgb, var(--bg) 92%, transparent); border-bottom: 1px solid var(--line); }
.lp-nav-in { display: flex; align-items: center; gap: 20px; height: 64px; }
.lp-brand { display: flex; align-items: center; gap: 10px; border: 0; background: none; padding: 0; cursor: pointer; color: var(--fg); }
.lp-brand b { font: 700 17px var(--f-display); letter-spacing: -.02em; }
.lp-links { display: flex; gap: 4px; margin-left: 12px; flex: 1; }
.lp-links button { border: 0; background: none; color: var(--muted); padding: 8px 12px; border-radius: 8px; cursor: pointer; font-weight: 500; transition: color .15s, background .15s; }
.lp-links button:hover { color: var(--fg); background: var(--surface-2); }
.lp-nav-cta { margin-left: auto; gap: 6px; flex-wrap: nowrap; }

.lp-hero { position: relative; padding-block: 72px 64px; background: radial-gradient(70% 90% at 85% 10%, var(--glow), transparent 60%), radial-gradient(50% 60% at 0% 100%, color-mix(in srgb, var(--glow) 50%, transparent), transparent 70%); }
.lp-hero-in { display: grid; grid-template-columns: minmax(0, 1.05fr) minmax(0, 1fr); gap: 56px; align-items: center; }
.lp-copy { display: flex; flex-direction: column; gap: 20px; min-width: 0; }
.lp-eyebrow { display: inline-flex; align-items: center; gap: 8px; align-self: flex-start; padding: 6px 12px; border-radius: 20px; border: 1px solid color-mix(in srgb, var(--accent) 30%, var(--line)); background: var(--accent-soft); color: var(--accent); font-size: 12px; font-weight: 500; }
.lp-eyebrow i { width: 6px; height: 6px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 0 4px color-mix(in srgb, var(--accent) 25%, transparent); }
.lp-h1 { font: 700 clamp(40px, 6.2vw, 68px)/1.02 var(--f-display); letter-spacing: -.045em; }
.lp-h1 em { font-style: normal; background: linear-gradient(100deg, var(--accent-2), var(--accent)); -webkit-background-clip: text; background-clip: text; color: transparent; }
.lp-lede { font-size: 18px; line-height: 1.55; color: var(--muted); max-width: 52ch; }
.lp-cta { gap: 10px; }

.lp-demo { border-radius: 20px; border: 1px solid color-mix(in srgb, var(--accent) 22%, var(--line)); background: linear-gradient(180deg, var(--surface), color-mix(in srgb, var(--surface) 55%, var(--bg))); box-shadow: 0 1px 0 var(--hi) inset, 0 40px 80px -40px rgba(0,0,0,.7), 0 0 0 8px color-mix(in srgb, var(--surface-2) 40%, transparent); overflow: hidden; min-width: 0; }
.lp-demo-top { display: flex; align-items: center; gap: 10px; padding: 14px 18px; border-bottom: 1px solid var(--line); }
.lp-demo-top .grow { flex: 1; min-width: 0; line-height: 1.25; }
.lp-demo-top b { display: block; font-size: 13px; } .lp-demo-top small { color: var(--muted); font-size: 11px; }
.lp-demo-body { display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr); gap: 18px; padding: 20px 18px; }
.lp-demo-body .hero-num { font-size: clamp(28px, 3.4vw, 38px); }
.lp-demo-body .gauge svg { width: min(104px, 100%); }
.lp-demo-body .g-mid { max-width: 104px; } .lp-demo-body .g-mid b { font-size: 18px; }
.lp-demo-alert { margin: 0 18px 18px; }

.lp-stats { border-block: 1px solid var(--line); background: var(--surface); padding-block: 28px 18px; }
.lp-stats-in { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 24px; }
.lp-stats-in div { display: flex; flex-direction: column; gap: 4px; }
.lp-stats-in b { font-size: 34px; font-weight: 500; letter-spacing: -.05em; color: var(--accent); }
.lp-stats-in span { color: var(--muted); font-size: 14px; max-width: 30ch; }
.lp-src { font-size: 11px; color: var(--faint); margin-top: 14px; }

.lp-sec { padding-block: 88px; }
.lp-sec.alt { background: color-mix(in srgb, var(--surface) 55%, var(--bg)); border-block: 1px solid var(--line); }
.lp-kicker { display: block; font-size: 12px; text-transform: uppercase; letter-spacing: .12em; color: var(--accent); font-weight: 600; margin-bottom: 12px; }
.lp-h2 { font: 700 clamp(28px, 3.8vw, 42px)/1.08 var(--f-display); letter-spacing: -.035em; max-width: 22ch; }
.lp-sub { color: var(--muted); font-size: 16px; max-width: 60ch; margin-top: 14px; }
.lp-steps { list-style: none; padding: 0; margin: 40px 0 0; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; counter-reset: none; }
.lp-steps li { padding: 24px; border-radius: var(--r); border: 1px solid var(--line); background: var(--surface); display: flex; flex-direction: column; gap: 10px; box-shadow: var(--shadow); }
.lp-steps li > .num { color: var(--accent); font-size: 13px; font-weight: 500; }
.lp-steps h3, .lp-feat h3, .lp-price h3 { font-size: 18px; letter-spacing: -.02em; }
.lp-steps p, .lp-feat p { color: var(--muted); font-size: 14px; }
.lp-feats { margin-top: 40px; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 1px; background: var(--line); border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; }
.lp-feat { background: var(--surface); padding: 26px; display: flex; flex-direction: column; gap: 10px; }
.lp-ic { width: 38px; height: 38px; border-radius: 10px; display: grid; place-items: center; background: var(--accent-soft); color: var(--accent); }
.lp-ic svg { width: 19px; height: 19px; }
.lp-firms { margin-top: 32px; display: flex; flex-wrap: wrap; gap: 8px; }
.lp-firms span { padding: 8px 14px; border-radius: 22px; border: 1px solid var(--line-2); background: var(--surface); font-size: 13px; font-weight: 500; }
.lp-firms .more { border-style: dashed; color: var(--muted); background: none; }
.lp-prices { margin-top: 40px; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; align-items: start; }
.lp-price { position: relative; padding: 28px; border-radius: 18px; border: 1px solid var(--line); background: var(--surface); display: flex; flex-direction: column; gap: 14px; box-shadow: var(--shadow); }
.lp-price.pro { border-color: color-mix(in srgb, var(--accent) 45%, var(--line)); background: radial-gradient(120% 80% at 50% 0%, var(--glow), transparent 60%), var(--surface); }
.lp-price .chip { position: absolute; top: 24px; right: 24px; }
.lp-amt b { font-size: 44px; font-weight: 500; letter-spacing: -.05em; }
.lp-amt span { color: var(--muted); margin-left: 4px; }
.lp-price > p { color: var(--muted); font-size: 14px; }
.lp-price ul { list-style: none; padding: 0; margin: 0 0 6px; display: flex; flex-direction: column; gap: 9px; font-size: 14px; }
.lp-price li { display: flex; gap: 10px; align-items: baseline; }
.lp-price li::before { content: ""; flex: none; width: 12px; height: 7px; border-left: 2px solid var(--accent); border-bottom: 2px solid var(--accent); transform: rotate(-45deg) translateY(-2px); }
.lp-faq { display: grid; grid-template-columns: minmax(0, .8fr) minmax(0, 1.4fr); gap: 40px; }
.lp-faq details { border-bottom: 1px solid var(--line); padding-block: 18px; }
.lp-faq details:first-child { border-top: 1px solid var(--line); }
.lp-faq summary { cursor: pointer; font-weight: 600; font-size: 16px; list-style: none; display: flex; justify-content: space-between; gap: 16px; }
.lp-faq summary::-webkit-details-marker { display: none; }
.lp-faq summary::after { content: "+"; color: var(--accent); font: 400 22px/1 var(--f-num); transition: transform .2s; }
.lp-faq details[open] summary::after { transform: rotate(45deg); }
.lp-faq details p { color: var(--muted); margin-top: 10px; max-width: 64ch; }
.lp-final { padding-block: 80px; background: radial-gradient(60% 120% at 50% 100%, var(--glow), transparent 70%); border-top: 1px solid var(--line); }
.lp-final-in { display: flex; flex-direction: column; align-items: center; text-align: center; gap: 24px; }
.lp-final .lp-h2 { max-width: 20ch; }
.lp-foot { padding-block: 32px calc(32px + env(safe-area-inset-bottom, 0px)); border-top: 1px solid var(--line); }
.lp-foot .disclaimer { margin-top: 16px; }

/* ---------- Log in ---------- */
.auth { min-height: 100%; display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); }
.auth-side { position: relative; display: flex; flex-direction: column; justify-content: space-between; gap: 32px; padding: 36px max(40px, env(safe-area-inset-left, 0px)) 36px 40px; border-right: 1px solid var(--line); background: radial-gradient(80% 70% at 20% 0%, var(--glow), transparent 65%), color-mix(in srgb, var(--surface) 55%, var(--bg)); overflow: hidden; }
.auth-side-mid { display: flex; flex-direction: column; gap: 28px; max-width: 520px; }
.auth-main { display: grid; place-items: center; padding: 40px max(24px, env(safe-area-inset-right, 0px)) 40px 24px; }
.auth-card { width: min(400px, 100%); display: flex; flex-direction: column; gap: 16px; }
.auth-card h1 { font: 700 32px/1.1 var(--f-display); letter-spacing: -.035em; }
.auth-card > p.muted { margin-top: -8px; }
.auth-tabs { display: grid; grid-template-columns: 1fr 1fr; }
.auth-tabs button { padding: 8px; }
.auth-card .input { height: 46px; }
.auth-card .field > span { display: flex; }
.auth-or { display: flex; align-items: center; gap: 12px; color: var(--faint); font-size: 12px; }
.auth-or::before, .auth-or::after { content: ""; flex: 1; height: 1px; background: var(--line); }
.auth-fine { text-align: center; }
.auth-mobile-brand { display: none; margin-bottom: 8px; }

@keyframes fade { from { opacity: 0; } }
@keyframes pop { from { opacity: 0; transform: translateY(6px) scale(.98); } }
@keyframes slide-l { from { transform: translateX(24px); opacity: 0; } }
@keyframes toast-in { from { opacity: 0; transform: translate(-50%, 8px); } }
@keyframes sheet-up { from { transform: translateY(100%); } }
@keyframes breathe { 50% { opacity: .55; transform: scale(.94); } }

@media (max-width: 1100px) { .g4 { grid-template-columns: repeat(2, minmax(0, 1fr)); } .kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); } .kpi:nth-child(3) { border-left: 0; } .kpi:nth-child(n+3) { border-top: 1px solid var(--line); } }
@media (max-width: 860px) {
  .app { grid-template-columns: minmax(0, 1fr); }
  .side { display: none; }
  .main { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 0 calc(112px + env(safe-area-inset-bottom, 0px)); }
  .top-mark { display: grid; }
  .g2, .g3 { grid-template-columns: minmax(0, 1fr); }
  .span2 { grid-column: auto; }
  .top { margin-bottom: 18px; padding-block: 10px; }
  h1 { font-size: 22px; }
  .hero { grid-template-columns: minmax(0, 1fr); padding: 26px 18px 22px; gap: 18px; background: none; box-shadow: none; }
  .hero-main { align-items: center; text-align: center; }
  .hero-stats { justify-content: center; margin-top: 4px; }
  .hero-dial .bezel { --bz: 220px !important; }
  .input, select.input { font-size: 16px; } /* stops iOS zooming the page on every field tap */
  .tabbar { display: grid; grid-template-columns: repeat(5, 1fr); position: fixed; left: max(14px, env(safe-area-inset-left, 0px)); right: max(14px, env(safe-area-inset-right, 0px)); bottom: calc(12px + env(safe-area-inset-bottom, 0px)); z-index: 30; height: 62px; align-items: center; border-radius: 31px; background: rgba(22,21,19,.94); box-shadow: inset 0 1px 0 var(--hi), 0 0 0 1px var(--line), 0 16px 34px -12px rgba(0,0,0,.9); }
  .tabbar button { border: 0; background: none; color: var(--faint); display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 9px 0 8px; font-size: 10.5px; font-weight: 500; cursor: pointer; position: relative; transition: color .15s; }
  .tabbar button svg { width: 21px; height: 21px; transition: transform .15s; }
  .tabbar button:active svg { transform: scale(.88); }
  .tabbar button[aria-current="page"] { color: var(--fg); }
